<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" font-family="'Yu Gothic UI','Yu Gothic',Meiryo,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">利用者が入れるものと、自動で入るもの</title>
  <desc id="d">利用者が入れるのは Claude Code・Python 3.10 以上・Obsidian。ライブラリは /vault-kb:init が専用環境に自動で入れる。Python 以外の外部コマンドと、ライブラリの手動インストールは不要。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="249" fill="#ffffff" stroke="#bbbbbb"/>

  <rect x="20" y="30" width="230" height="150" fill="#eef3ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="135" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a6b">利用者が入れる</text>
  <text x="135" y="94" text-anchor="middle" font-size="14" fill="#1b2a6b">Claude Code</text>
  <text x="135" y="122" text-anchor="middle" font-size="14" fill="#1b2a6b">Python 3.10 以上</text>
  <text x="135" y="150" text-anchor="middle" font-size="14" fill="#1b2a6b">Obsidian</text>

  <line x1="250" y1="105" x2="298" y2="105" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="274" y="94" text-anchor="middle" font-size="13" fill="#333">init</text>

  <rect x="300" y="30" width="250" height="150" rx="30" fill="#fff4e0" stroke="#e8590c" stroke-width="2"/>
  <text x="425" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a2e00">自動で入る</text>
  <text x="425" y="94" text-anchor="middle" font-size="14" fill="#7a2e00">専用の Python 環境</text>
  <text x="425" y="122" text-anchor="middle" font-size="14" fill="#7a2e00">markitdown と依存（版は固定）</text>
  <text x="425" y="150" text-anchor="middle" font-size="14" fill="#7a2e00">約 300 MB。PyPI から取得</text>

  <rect x="580" y="30" width="200" height="150" rx="6" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="680" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">不要</text>
  <text x="680" y="94" text-anchor="middle" font-size="14" fill="#222">Python 以外の</text>
  <text x="680" y="114" text-anchor="middle" font-size="14" fill="#222">外部コマンド</text>
  <text x="680" y="144" text-anchor="middle" font-size="14" fill="#222">ライブラリの</text>
  <text x="680" y="164" text-anchor="middle" font-size="14" fill="#222">手動インストール</text>

  <rect x="20" y="206" width="26" height="22" fill="#eef3ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="54" y="222" font-size="13" fill="#222">利用者の作業</text>
  <rect x="190" y="206" width="26" height="22" rx="10" fill="#fff4e0" stroke="#e8590c" stroke-width="2"/>
  <text x="224" y="222" font-size="13" fill="#222">自動</text>
  <rect x="300" y="206" width="26" height="22" rx="3" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="334" y="222" font-size="13" fill="#222">不要</text>
</svg>
