<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="'Yu Gothic UI','Yu Gothic',Meiryo,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">vault-kb フォルダの構成</title>
  <desc id="d">vault の直下は3種類。片づけの対象の5フォルダ、利用者のフォルダの5つ、片づけが作るノートと記録。</desc>
  <rect x="0.5" y="0.5" width="799" height="419" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">vault-kb/（Obsidian で開く vault の根）</text>

  <!-- 片づけの対象 -->
  <rect x="20" y="48" width="420" height="356" fill="#eef3ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="34" y="74" font-size="15" font-weight="bold" fill="#1b2a6b">片づけの対象（原本を置く）</text>

  <text x="34" y="106" font-size="15" font-weight="bold" fill="#1b2a6b">00_inbox/</text>
  <text x="34" y="126" font-size="13" fill="#1b2a6b">仕分け前。ここに置くと片づく（保留・失敗の資料は残る）</text>

  <text x="34" y="164" font-size="15" font-weight="bold" fill="#1b2a6b">20_projects/&lt;案件&gt;/&lt;区分&gt;/</text>
  <text x="34" y="184" font-size="13" fill="#1b2a6b">進行中の案件の原本。区分は 01_見積 のように番号つき</text>

  <text x="34" y="222" font-size="15" font-weight="bold" fill="#1b2a6b">80_archive/&lt;案件&gt;/&lt;区分&gt;/</text>
  <text x="34" y="242" font-size="13" fill="#1b2a6b">完了した案件（20_projects と同じ構造）</text>

  <text x="34" y="280" font-size="15" font-weight="bold" fill="#1b2a6b">30_shared/&lt;区分&gt;/</text>
  <text x="34" y="300" font-size="13" fill="#1b2a6b">どの案件にも属さない資料</text>

  <text x="34" y="338" font-size="15" font-weight="bold" fill="#1b2a6b">40_knowledge/&lt;区分&gt;/</text>
  <text x="34" y="358" font-size="13" fill="#1b2a6b">案件に属さないノウハウ・手順・調査メモ</text>

  <text x="34" y="388" font-size="13" fill="#1b2a6b">どの案件にも 99_その他 の区分がある</text>

  <!-- 利用者のフォルダ -->
  <rect x="460" y="48" width="320" height="172" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="474" y="74" font-size="15" font-weight="bold" fill="#222">利用者のフォルダ（動かさない）</text>
  <text x="474" y="102" font-size="14" fill="#222"><tspan font-weight="bold">10_daily/</tspan>　デイリーノート</text>
  <text x="474" y="128" font-size="14" fill="#222"><tspan font-weight="bold">50_prompts/</tspan>　Claude 指示プロンプト</text>
  <text x="474" y="154" font-size="14" fill="#222"><tspan font-weight="bold">90_attachments/</tspan>　添付ファイル</text>
  <text x="474" y="180" font-size="14" fill="#222"><tspan font-weight="bold">91_templates/</tspan>　テンプレート 7 種類</text>
  <text x="474" y="206" font-size="13" fill="#222">検索の対象外。ノートも作らない</text>

  <!-- ノートと記録 -->
  <rect x="460" y="262" width="320" height="142" rx="14" fill="#fff4e0" stroke="#e8590c" stroke-width="2"/>
  <text x="474" y="288" font-size="15" font-weight="bold" fill="#7a2e00">ノートと記録（片づけが作る）</text>
  <text x="474" y="314" font-size="14" fill="#7a2e00"><tspan font-weight="bold">.notes/</tspan>　隠しフォルダ</text>
  <text x="474" y="334" font-size="13" fill="#7a2e00">ノートと、案件・区分の index.md</text>
  <text x="474" y="362" font-size="14" fill="#7a2e00"><tspan font-weight="bold">index.md</tspan>　案件の一覧（vault 直下）</text>
  <text x="474" y="388" font-size="14" fill="#7a2e00"><tspan font-weight="bold">log.md</tspan>　履歴（vault 直下）</text>
</svg>
