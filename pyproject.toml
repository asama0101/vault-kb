# パッケージとしては配布しない。ruff に対象の Python の版を伝えるための最小の表
# （run.py の MIN_PYTHON と同じ。上限の 3.15 未満は run.py が検査する）
[project]
name = "vault-kb"
requires-python = ">=3.12"
dynamic = ["version"]

[dependency-groups]
dev = [
    "colorama==0.4.6",
    "iniconfig==2.3.1",
    "pluggy==1.7.0",
    "pytest==9.1.1",
    "pytest-randomly==5.0.0",
    "python-docx==1.2.0",
    "ruff==0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
# テストは assert を使い、実ファイルを subprocess で起動する
"tests/*" = ["S101", "S603"]
# 入口スクリプトは、固定の専用環境の Python を引数配列で起動する（shell=False）
"plugins/vault-kb/run.py" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/vault-kb"]
addopts = ["--strict-markers", "-ra"]
xfail_strict = true
markers = ["slow: 専用環境の実導入（ネットワークと数分）を伴うテスト"]
